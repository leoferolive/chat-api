apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-api-config
  namespace: chat-api-dev
data:
  ENV: "dev"
  ALLOWED_ORIGINS: "https://leoferolive-dev.leoferolive.com.br,http://localhost:5173"
  WIKI_DIR: "/wiki/repo/current"
  DB_PATH: "/data/chat.sqlite"
  # Turnstile turned off — the invisible widget hung on real browsers
  # without ever resolving (TrustedTypes-related interaction inside the
  # CF iframe). Rate limit + daily cost gate are sufficient guards for
  # a low-traffic personal portfolio. Revisit if abuse appears.
  TURNSTILE_DISABLED: "true"
  SESSION_TTL_SECONDS: "3600"
  RATE_LIMIT_PER_IP: "30/5minutes"
  DAILY_LLM_CALL_LIMIT: "200"
  DAILY_CALLS_PER_IP_LIMIT: "200"
  MESSAGES_PER_SESSION_LIMIT: "10"
  MAX_USER_MESSAGE_CHARS: "800"
  MAX_MESSAGES_PER_REQUEST: "20"
  LLM_MAX_TOKENS: "1000"
  ROUTER_MAX_TOKENS: "1500"
  # Dev exercises OpenRouter as the primary provider so we can validate
  # the integration independently of Gemini.
  # Alias no LiteLLM proxy (chat + router); judge usa company-reasoning.
  LLM_PROVIDERS: "company-code"
  # US$/1M tokens por alias do proxy (ajustar aos preços reais).
  LLM_ALIAS_PRICING: '{"company-code":{"input":0,"output":0},"company-reasoning":{"input":0,"output":0}}'
  LITELLM_PROXY_URL: "http://litellm.ai.svc.cluster.local:4000"
  ZAI_BASE_URL: "https://api.z.ai/api/coding/paas/v4/"
  WIKI_POLL_SECONDS: "60"
  # readOnlyRootFilesystem=true: only /tmp is writable. Several litellm
  # transitive deps default to caching under $HOME (tiktoken's BPE cache,
  # HF/XDG cache dirs) rather than the tempfile module's /tmp default.
  # Pin them explicitly so we don't depend on each lib's default and risk
  # a first-request crash if one of them writes to the read-only home dir.
  HOME: "/tmp"
  TIKTOKEN_CACHE_DIR: "/tmp/tiktoken-cache"
  HF_HOME: "/tmp/hf-cache"
  XDG_CACHE_HOME: "/tmp/xdg-cache"
