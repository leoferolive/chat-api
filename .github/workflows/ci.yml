name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Pinned to the same major.minor as the Dockerfile (uv 0.10+,
          # required by uv.lock revision = 3) so `--locked` here exercises
          # the same lockfile-validation behavior as the image build.
          version: "0.10.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check app tests

      - name: Format check
        run: uv run ruff format --check app tests

      - name: Test
        run: uv run pytest -q
        env:
          ENV: ci
          TURNSTILE_DISABLED: "true"
          LLM_PROVIDERS: "mock/primary,mock/secondary"
          SESSION_SECRET: "ci-secret"
          IP_HASH_SALT: "ci-salt"
